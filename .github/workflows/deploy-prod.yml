name: Production Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: ci-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd ~/dev
            git fetch origin main
            git merge --ff-only origin/main
            docker compose stop mailpit || true
            docker compose -f docker-compose.prod.yml up -d --build backend frontend nginx minio
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            curl --fail --silent --show-error --insecure https://localhost/api/v1/healthz/
            curl --fail --silent --show-error --insecure https://localhost/
            docker image prune -af --filter "until=24h"
            docker builder prune -af --filter "until=24h"

  notify-discord:
    needs: [ci-test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send production deployment notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci-test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$CI_RESULT" = "failure" ]; then
            STATUS="❌ [운영 CI 실패]"
            DETAILS="운영 배포 전 CI 검증에서 오류가 발생했습니다."
          else
            STATUS="❌ [운영 배포 실패]"
            DETAILS="운영 EC2 배포 중 오류가 발생했습니다."
          fi

          ACTION_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="**${STATUS}**
          • **Repository:** ${{ github.repository }}
          • **Branch:** ${{ github.ref_name }}
          • **상세 내용:** ${DETAILS}
          • **Action 링크:** ${ACTION_URL}"

          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
