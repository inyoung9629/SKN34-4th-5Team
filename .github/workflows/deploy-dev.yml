name: CI & CD Workflow

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  # 1. CI 검증
  ci-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        run: npm run build

  # 2. CD 배포 (develop 브랜치 push/merge 시 실행)
  cd-deploy:
    needs: ci-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd ~/dev
            git fetch origin
            git reset --hard origin/develop
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --renew-anon-volumes backend frontend
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --no-deps --force-recreate nginx
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T nginx nginx -t

            # 오래된 Docker 이미지와 빌드 캐시 정리
            docker image prune -af --filter "until=24h"
            docker builder prune -af --filter "until=24h"

  # 3. Discord 알림!
  notify-discord:
    needs: [ci-test, cd-deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        if: needs.ci-test.result == 'failure' || needs.cd-deploy.result == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.ci-test.result }}" = "failure" ]; then
            STATUS="❌ [CI 실패]"
            DETAILS="CI 검증 작업(테스트/빌드) 중 오류가 발생했습니다."
          elif [ "${{ needs.cd-deploy.result }}" = "failure" ]; then
            STATUS="❌ [배포 실패]"
            DETAILS="EC2 배포 작업 중 오류가 발생했습니다."
          fi

          BRANCH="${{ github.head_ref || github.ref_name }}"
          ACTION_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE="**${STATUS}**
          • **Repository:** ${{ github.repository }}
          • **Branch:** ${BRANCH}
          • **상세 내용:** ${DETAILS}
          • **Action 링크:** ${ACTION_URL}"

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"