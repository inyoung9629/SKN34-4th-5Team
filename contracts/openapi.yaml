openapi: 3.0.3
info:
  title: KBO Journey API
  version: 1.0.0
paths:
  /api/{version}/chat/admin/feedback/:
    get:
      operationId: chat_admin_feedback_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminFeedbackList'
          description: ''
  /api/{version}/chat/admin/feedback/{id}/:
    get:
      operationId: chat_admin_feedback_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFeedback'
          description: ''
  /api/{version}/chat/sessions/:
    get:
      operationId: chat_sessions_list
      description: |-
        채팅방 리스트 조회 View
        URL: /api/v2/chat/sessions/

        GET: 회원/비회원 모두 자신의 대화방 목록을 조회합니다.
                return list_대화방
        POST: 회원/비회원 모두 새 대화방을 생성합니다. 비회원은 guest_id 쿠키로 식별합니다.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatSessionList'
          description: ''
    post:
      operationId: chat_sessions_create
      description: |-
        채팅방 리스트 조회 View
        URL: /api/v2/chat/sessions/

        GET: 회원/비회원 모두 자신의 대화방 목록을 조회합니다.
                return list_대화방
        POST: 회원/비회원 모두 새 대화방을 생성합니다. 비회원은 guest_id 쿠키로 식별합니다.
      parameters:
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSession'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
  /api/{version}/chat/sessions/{session_id}/:
    put:
      operationId: chat_sessions_update
      description: |-
        URL: /api/v2/chat/sessions/<session_id>/

        PATCH: 대화방 정보를 수정합니다.
        DELETE: 대화방을 삭제합니다. 대화 checkpoint 는 commit 뒤 지운다(llm.apps 의 post_delete outbox, 실패 시 재시도).
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSession'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
    patch:
      operationId: chat_sessions_partial_update
      description: |-
        URL: /api/v2/chat/sessions/<session_id>/

        PATCH: 대화방 정보를 수정합니다.
        DELETE: 대화방을 삭제합니다. 대화 checkpoint 는 commit 뒤 지운다(llm.apps 의 post_delete outbox, 실패 시 재시도).
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChatSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChatSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChatSession'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
    delete:
      operationId: chat_sessions_destroy
      description: |-
        URL: /api/v2/chat/sessions/<session_id>/

        PATCH: 대화방 정보를 수정합니다.
        DELETE: 대화방을 삭제합니다. 대화 checkpoint 는 commit 뒤 지운다(llm.apps 의 post_delete outbox, 실패 시 재시도).
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/{version}/chat/sessions/{session_id}/feedback/:
    put:
      operationId: chat_sessions_feedback_update
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackInput'
          description: ''
  /api/{version}/chat/sessions/{session_id}/messages/:
    get:
      operationId: chat_sessions_messages_retrieve
      description: 해당 세션의 채팅목록을 가져온다. 소유하지 않은/존재하지 않는 세션이면 404.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: chat_sessions_messages_create
      description: LLM 호출 (SSE 스트리밍). version 으로 chat_v1/chat_v2 의 실제 구현을 직접 고른다.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
    put:
      operationId: chat_sessions_messages_update
      description: 이후 채팅목록을 수정 + LLM 호출. version 으로 chat_v1/chat_v2 의 실제 구현을 직접 고른다.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
    delete:
      operationId: chat_sessions_messages_destroy
      description: 이후 채팅목록을 삭제한다.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/{version}/chat/usage/:
    get:
      operationId: chat_usage_retrieve
      description: 'GET /api/v{1,2}/chat/usage/: 요청자 본인(회원 JWT / 비회원 guest_id 쿠키)의
        토큰 잔액. 조회는 차감하지 않는다.'
      parameters:
      - in: path
        name: version
        schema:
          type: string
          pattern: ^v1|v2$
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/ads/admin/creatives/:
    get:
      operationId: v1_ads_admin_creatives_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdAdminList'
          description: ''
    post:
      operationId: v1_ads_admin_creatives_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdAdmin'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAdmin'
          description: ''
  /api/v1/ads/admin/creatives/{id}/:
    get:
      operationId: v1_ads_admin_creatives_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAdmin'
          description: ''
    patch:
      operationId: v1_ads_admin_creatives_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdAdmin'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAdmin'
          description: ''
  /api/v1/ads/events/:
    post:
      operationId: v1_ads_events_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdEventInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdEventInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdEventInput'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdEventResult'
          description: ''
  /api/v1/ads/slots/:
    get:
      operationId: v1_ads_slots_retrieve
      parameters:
      - in: query
        name: placement
        schema:
          enum:
          - home-club-banner
          - home-route-partner-banner
          type: string
          minLength: 1
        description: |-
          * `home-club-banner` - 홈 구단 광고
          * `home-route-partner-banner` - 홈 음식점·시설 광고
        required: true
      - in: query
        name: route_ids
        schema:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 3
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSlotResponse'
          description: ''
  /api/v1/auth/admin/members/:
    get:
      operationId: v1_auth_admin_members_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminMemberList'
          description: ''
  /api/v1/auth/admin/members/{id}/role/:
    patch:
      operationId: v1_auth_admin_members_role_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - is_staff
              properties:
                is_staff:
                  type: boolean
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMember'
          description: ''
  /api/v1/auth/email/request:
    post:
      operationId: v1_auth_email_request_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeRequestResponse'
          description: ''
  /api/v1/auth/email/verify:
    post:
      operationId: v1_auth_email_verify_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: false
          description: ''
  /api/v1/auth/password:
    post:
      operationId: v1_auth_password_create
      description: |-
        사용자 비밀번호를 변경합니다.
        Url: POST /auth/password
        Query (이메일 재설정): uid, token
        Headers (로그인 상태): Authorization: Bearer <access_token>
        Args:
            - current_password: 기존 비밀번호 (로그인 상태에서 필수)
            - new_password: 새 비밀번호
            - new_password_confirm: 새 비밀번호 확인
        기존 old_password, password, re_password 필드명도 지원합니다.
        Return: HTTP_200_OK
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/request:
    post:
      operationId: v1_auth_password_request_create
      description: |-
        사용자 비밀번호 재설정 url 을 이메일로 전송합니다.
        Url: /api/v1/auth/password/request
        Args:
            - email
        Return:
            - HTTP_200_OK
        1. 검증
        2. 비밀번호 재설정용 토큰 발급
        3. 이메일 전송
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmail'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/signin:
    post:
      operationId: v1_auth_signin_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: v1_auth_signup_create
      description: |-
        회원가입하는 함수입니다.
        Url : /api/v1/auth/signup/
        Args:
            - username
            - email, first_name, birth_date, gender
            - password
            - re_password
        Return:
            - HTTP_201_CREATED
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      responses:
        '201':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
  /api/v1/auth/user:
    get:
      operationId: v1_auth_user_retrieve
      description: |-
        로그인한 사용자 정보를 조회합니다.
        Url: GET /api/v1/auth/user
        Headers: Authorization: Bearer <access_token>
        Return:
            - HTTP_200_OK
            - HTTP_401_UNAUTHORIZED (토큰 미전달 또는 JWT 인증 실패)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberUser'
          description: ''
    patch:
      operationId: v1_auth_user_partial_update
      description: |-
        로그인한 사용자 정보를 조회합니다.
        Url: GET /api/v1/auth/user
