components:
  schemas:
    AdAdmin:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        advertiser:
          type: string
          title: 광고주
          maxLength: 120
        title:
          type: string
          title: 제목
          maxLength: 120
        description:
          type: string
          title: 설명
          maxLength: 250
        image_url:
          type: string
          format: uri
          title: 이미지 URL
          maxLength: 1000
        image_alt:
          type: string
          title: 이미지 설명
          maxLength: 250
        destination_url:
          type: string
          format: uri
          title: 이동 URL
          maxLength: 1000
        button_label:
          type: string
          title: 버튼 문구
          maxLength: 40
        context_label:
          type: string
          title: 지역·분류
          maxLength: 120
        placement:
          allOf:
          - $ref: '#/components/schemas/PlacementEnum'
          title: 위치
        starts_at:
          type: string
          format: date-time
          title: 시작 일시
        ends_at:
          type: string
          format: date-time
          title: 종료 일시
        active:
          type: boolean
          title: 활성
        is_test:
          type: boolean
          title: 테스트 광고
        priority:
          type: integer
          maximum: 32767
          minimum: 0
          title: 우선순위
        team_code:
          type: string
          title: 구단 코드
          maxLength: 10
        place:
          type: integer
          nullable: true
          title: 제휴 장소
        courses:
          type: array
          items:
            type: string
            format: uuid
            title: 노출 대상 코스
          title: 노출 대상 코스
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - advertiser
      - created_at
      - destination_url
      - ends_at
      - id
      - image_url
      - placement
      - starts_at
      - title
      - updated_at
    AdEventInput:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 2048
        kind:
          $ref: '#/components/schemas/AdEventInputKindEnum'
      required:
      - event_id
      - kind
      - token
    AdEventInputKindEnum:
      enum:
      - impression
      - click
      type: string
      description: |-
        * `impression` - 노출
        * `click` - 클릭
    AdEventResult:
      type: object
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
      required:
      - accepted
      - duplicate
    AdPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        advertiser:
          type: string
          readOnly: true
          title: 광고주
        title:
          type: string
          readOnly: true
          title: 제목
        description:
          type: string
          readOnly: true
          title: 설명
        image_url:
          type: string
          format: uri
          readOnly: true
          title: 이미지 URL
        image_alt:
          type: string
          readOnly: true
