# Local, small-volume search experiment. No paid API engines or proxy rotation.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
general:
  debug: false
  instance_name: "Local course search test"
  enable_metrics: false
search:
  safe_search: 1
  default_lang: ko-KR
  autocomplete: ""
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
