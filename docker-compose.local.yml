# Local HTTP startup: reuse the same prebuilt MinIO image as docker-compose.dev.yml.
# Run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  course-place-warmer:
    environment:
      COURSE_WEB_VERIFICATION_ENABLED: "true"
  frontend:
    # Windows bind mounts can miss Turbopack file events and keep serving old JS.
    command: ["npm", "run", "dev", "--", "--webpack", "-H", "0.0.0.0"]
    environment:
      WATCHPACK_POLLING: "1000"
  backend:
    environment:
      COURSE_WEB_VERIFICATION_ENABLED: "true"
      COURSE_PLACE_WARM_ENABLED: "true"
      FANTASY_LOCAL_REQUEST_JOBS_ENABLED: "true"
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    build: !reset null
